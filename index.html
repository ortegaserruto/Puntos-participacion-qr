<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador Multisección de Carnets QR - I.E.S. Micaela Bastidas</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --primary: #1e293b;
      --gold: #f59e0b;
      --border-color: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: #f1f5f9;
      color: #0f172a;
      padding: 1rem;
    }

    .no-print-panel {
      max-width: 820px;
      margin: 0 auto 1.5rem auto;
      background: #fff;
      padding: 1.25rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      border: 1px solid var(--border-color);
    }

    .no-print-panel h2 {
      font-size: 1.2rem;
      color: var(--primary);
      margin-bottom: 0.4rem;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
      align-items: center;
    }

    select, input[type="file"] {
      padding: 0.5rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .btn-print {
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 0.65rem 1.4rem;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-print:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    /* CONTENEDOR A4 */
    #printArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15mm;
    }

    .a4-page {
      width: 210mm;
      min-height: 297mm;
      background: #fff;
      padding: 8mm;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 64mm;
      gap: 5mm;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      page-break-after: always;
    }

    /* CARNET */
    .student-card {
      border: 1.5px dashed #64748b;
      border-radius: 8px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      background: #ffffff;
      overflow: hidden;
    }

    .card-header {
      width: 100%;
      border-bottom: 2px solid var(--gold);
      padding-bottom: 2px;
    }

    .card-inst {
      font-size: 7.5pt;
      font-weight: 800;
      color: #b91c1c;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .card-sub {
      font-size: 6pt;
      font-weight: 700;
      color: #1e3a8a;
      text-transform: uppercase;
    }

    .card-body {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-around;
      gap: 4px;
      margin: auto 0;
    }

    .qr-box {
      width: 95px;
      height: 95px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-box img {
      width: 100% !important;
      height: 100% !important;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      text-align: left;
      max-width: 48%;
    }

    .student-code {
      font-size: 8pt;
      font-weight: 800;
      color: #0f172a;
    }

    .student-grade {
      font-size: 7.5pt;
      font-weight: 700;
      color: #b45309;
    }

    .card-footer {
      width: 100%;
      background: #0f172a;
      color: #fff;
      border-radius: 4px;
      padding: 3px 2px;
    }

    .student-name {
      font-size: 7.5pt;
      font-weight: 800;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      .no-print-panel {
        display: none !important;
      }
      #printArea {
        gap: 0;
      }
      .a4-page {
        box-shadow: none;
        margin: 0;
        padding: 8mm 6mm;
        page-break-after: always;
      }
    }
  </style>
</head>
<body>

  <div class="no-print-panel">
    <h2>Generador de Carnets QR Multisección</h2>
    <p style="font-size: 0.85rem; color: #475569;">
      Sube tu Excel con las secciones (Columna A: DNI/Código, Columna B: Apellidos y Nombres, Columna C: Grado y Sección).
    </p>

    <div class="controls-row">
      <input type="file" id="excelInput" accept=".xlsx, .xls">
      
      <div id="filterWrapper" style="display: none; align-items: center; gap: 0.5rem;">
        <label for="seccionSelect" style="font-size: 0.85rem; font-weight: 600;">Sección:</label>
        <select id="seccionSelect"></select>
      </div>

      <button id="btnPrint" class="btn-print" disabled onclick="window.print()">
        🖨️ Imprimir Carnets A4
      </button>
    </div>
  </div>

  <div id="printArea"></div>

  <script>
    let allStudents = [];
    const fileInput = document.getElementById('excelInput');
    const seccionSelect = document.getElementById('seccionSelect');
    const filterWrapper = document.getElementById('filterWrapper');
    const btnPrint = document.getElementById('btnPrint');
    const printArea = document.getElementById('printArea');

    fileInput.addEventListener('change', handleFile);
    seccionSelect.addEventListener('change', () => renderFilteredCards(seccionSelect.value));

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        
        allStudents = [];
        const sectionsSet = new Set();

        // Lee todas las pestañas que tenga el archivo
        workbook.SheetNames.forEach(sheetName => {
          const worksheet = workbook.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (row && row[0]) {
              const sec = String(row[2] || sheetName).trim();
              allStudents.push({
                codigo: String(row[0]).trim(),
                nombre: String(row[1] || 'Sin Nombre').trim(),
                seccion: sec
              });
              sectionsSet.add(sec);
            }
          }
        });

        if (allStudents.length === 0) {
          alert("No se encontraron registros en el Excel.");
          return;
        }

        // Cargar opciones de secciones en el selector
        seccionSelect.innerHTML = '<option value="TODAS">-- Todas las Secciones --</option>';
        sectionsSet.forEach(sec => {
          const opt = document.createElement("option");
          opt.value = sec;
          opt.textContent = sec;
          seccionSelect.appendChild(opt);
        });

        filterWrapper.style.display = "flex";
        renderFilteredCards("TODAS");
      };
      reader.readAsArrayBuffer(file);
    }

    function renderFilteredCards(selectedSec) {
      printArea.innerHTML = "";
      let filtered = (selectedSec === "TODAS") 
        ? allStudents 
        : allStudents.filter(s => s.seccion === selectedSec);

      if (filtered.length === 0) {
        btnPrint.disabled = true;
        return;
      }

      // Agrupar por sección para asegurar que cada sección inicie en una nueva página A4
      const groups = {};
      filtered.forEach(s => {
        if (!groups[s.seccion]) groups[s.seccion] = [];
        groups[s.seccion].push(s);
      });

      const CARDS_PER_PAGE = 12;
      let cardCounter = 0;

      Object.keys(groups).forEach(sec => {
        const studentsInSec = groups[sec];
        let currentPage = null;

        studentsInSec.forEach((student, index) => {
          if (index % CARDS_PER_PAGE === 0) {
            currentPage = document.createElement("div");
            currentPage.className = "a4-page";
            printArea.appendChild(currentPage);
          }

          const card = document.createElement("div");
          card.className = "student-card";
          const qrId = `qr_${cardCounter++}`;

          card.innerHTML = `
            <div class="card-header">
              <div class="card-inst">I.E.S. Micaela Bastidas</div>
              <div class="card-sub">Área de Innovación — Participación</div>
            </div>
            <div class="card-body">
              <div class="qr-box" id="${qrId}"></div>
              <div class="card-info">
                <span class="student-code">ID: ${student.codigo}</span>
                <span class="student-grade">${student.seccion}</span>
              </div>
            </div>
            <div class="card-footer">
              <div class="student-name" title="${student.nombre}">${student.nombre}</div>
            </div>
          `;

          currentPage.appendChild(card);

          new QRCode(document.getElementById(qrId), {
            text: student.codigo,
            width: 95,
            height: 95,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
          });
        });
      });

      btnPrint.disabled = false;
    }
  </script>
</body>
</html>
